<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Create Next App</title>
</head>

<body onload="showNotes()">
    <header class="bg-[#437993] p-[16px] flex flex-col w-full">

        <h1 class="text-white font-bold max-w-[396px] w-full text-[2.25rem] leading-[2.5rem] ml-40">Notes App</h1>
        <p class="font-light max-w-[396px] w-full text-white ml-40 ">Take Notes and never forget</p>

    </header>
    <nav class="text-[18px] bg-[#F7F7F7] py-4 text-black mb-4  flex justify-center gap-8">
        <div>
            <input type="text" placeholder="Filter by" class="bg-white p-2" />
        </div>
        <div>
            <select name="sortBy" class="bg-white p-2">
                <option value="sortBy">Sort By</option>
                <option value="sortBy">Alphabets</option>
                <option value="sortBy">Last Edited</option>
                <option value="sortBy">Recently Created</option>
            </select>
        </div>
    </nav>
    <div class=" py-4 max-w-[800px]  gap-3 flex flex-col mx-auto" id="notesContainer">
    </div>
    <button class="bg-[#437993] p-5 rounded-[8px] hover:cursor-pointer text-white fixed bottom-5 right-5"><a
            href="Notes.html">Create New Note</a></button>
    <script src="index.js"></script>
</body>

</html>
